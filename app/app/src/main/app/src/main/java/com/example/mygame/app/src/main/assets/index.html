<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  body{margin:0;background:#1b1b2f;color:#fff;font-family:sans-serif;text-align:center;overflow:hidden}
  #hud{padding:12px;font-size:20px}
  #area{position:relative;width:100vw;height:80vh}
  .dot{position:absolute;width:70px;height:70px;border-radius:50%;background:#ff4d6d}
  button{font-size:20px;padding:12px 24px;margin-top:30px}
</style>
</head>
<body>
<div id="hud">Score: <span id="score">0</span> | Time: <span id="time">30</span></div>
<div id="area"></div>
<script>
let score = 0, time = 30, timer, spawner;
const area = document.getElementById('area');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');

function spawn() {
  const d = document.createElement('div');
  d.className = 'dot';
  d.style.left = Math.random() * (area.clientWidth - 70) + 'px';
  d.style.top = Math.random() * (area.clientHeight - 70) + 'px';
  d.onclick = () => { score++; scoreEl.textContent = score; d.remove(); };
  area.appendChild(d);
  setTimeout(() => d.remove(), 1200);
}

function start() {
  score = 0; time = 30;
  scoreEl.textContent = 0; timeEl.textContent = 30;
  area.innerHTML = '';
  spawner = setInterval(spawn, 600);
  timer = setInterval(() => {
    time--; timeEl.textContent = time;
    if (time <= 0) end();
  }, 1000);
}

function end() {
  clearInterval(spawner); clearInterval(timer);
  area.innerHTML = '<h2>Game over! Score: ' + score + '</h2><button onclick="start()">Play again</button>';
}

area.innerHTML = '<button onclick="start()">Start</button>';
</script>
</body>
</html>
